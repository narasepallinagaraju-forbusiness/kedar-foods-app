[tool.ruff]
line-length = 88
target-version = "py312"
src = ["infra", "."]
exclude = [
    "infra/cdk.out",
    "infra/.venv",
    "node_modules",
    "out",
    ".next",
    "seed",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "infra/app.py",
    "infra/frontend_stack.py",
    "infra/backend_stack.py",
    "infra/tests",
    "api",
    "scripts/seed",
]
exclude = '(^|/)(infra/cdk\.out|infra/\.venv)(/|$)'

[[tool.mypy.overrides]]
module = ["aws_cdk.*", "constructs.*", "boto3.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["infra/tests", "api/tests", "scripts/seed/tests"]
pythonpath = [".", "infra"]
